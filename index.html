<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Opening in Obsidian…</title>
<script>
  // Scout deep-link shim:  ?v=<vault name>&f=<vault-relative note path, no .md>
  // Rebuild obsidian://open and hand off as fast as possible (a browser won't follow a
  // server 3xx to a custom scheme, so we navigate via JS). Fire in <head> so the
  // interstitial barely paints; if the OS can't take the scheme, the body's fallback shows.
  (function () {
    var q = new URLSearchParams(location.search);
    var v = q.get('v') || '', f = q.get('f') || '';
    if (!v || !f) return;
    var uri = 'obsidian://open?vault=' + encodeURIComponent(v) + '&file=' + encodeURIComponent(f);
    location.replace(uri);
    // Best-effort: dismiss this tab once we've handed off (works in some in-app browsers;
    // a no-op in Safari tabs, which can't be closed by script — harmless either way).
    setTimeout(function () { try { window.close(); } catch (e) {} }, 600);
  })();
</script>
</head>
<body style="font-family:-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5;padding:2rem;max-width:34rem;margin:0 auto;text-align:center;">
<h2 style="margin:0 0 .5rem;">Opening in Obsidian…</h2>
<p id="msg">You can close this tab. If the note didn't open, tap below.</p>
<p><a id="go" href="#" style="display:inline-block;font-size:1.05rem;padding:.6rem 1.1rem;border:1px solid currentColor;border-radius:8px;text-decoration:none;">Open in Obsidian</a></p>
<script>
  // Populate the manual fallback button (runs after the inline redirect attempt).
  (function () {
    var q = new URLSearchParams(location.search);
    var v = q.get('v') || '', f = q.get('f') || '';
    var go = document.getElementById('go');
    if (!v || !f) { document.getElementById('msg').textContent = 'Missing vault (v) or file (f) parameter.'; go.style.display = 'none'; return; }
    var uri = 'obsidian://open?vault=' + encodeURIComponent(v) + '&file=' + encodeURIComponent(f);
    go.href = uri;
    go.textContent = 'Open “' + (f.split('/').pop() || 'note') + '” in Obsidian';
  })();
</script>
</body>
</html>
